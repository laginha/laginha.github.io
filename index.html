<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Diogo Laginha, frontend lead with full-stack experience in Coimbra, Portugal: Next.js, React, TypeScript, design systems and AI-assisted engineering."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://laginha.github.io/" />
    <meta property="og:title" content="Diogo Laginha, frontend lead" />
    <meta
      property="og:description"
      content="A sliding puzzle about me, with a CV for the impatient."
    />
    <meta property="og:image" content="%VITE_AVATAR_URL%" />
    <meta name="twitter:card" content="summary" />
    <link
      rel="preload"
      as="image"
      href="%VITE_AVATAR_URL%"
      fetchpriority="high"
    />
    <title>Diogo Laginha</title>
  </head>
  <body
    class="flex justify-center container mx-auto bg-zinc-100 text-base text-center"
  >
    <div
      class="flex flex-col justify-between min-h-svh md:min-h-0 md:h-full w-full md:w-3/4 lg:w-1/2 pt-4 md:p-8 bg-white rounded-lg shadow-md"
    >
      <div>
        <header
          class="flex flex-col md:flex-row justify-center items-center mb-6"
        >
          <img
            class="w-20 h-20 rounded-full md:mr-4"
            src="%VITE_AVATAR_URL%"
            alt=""
          />
          <div>
            <h1 class="text-2xl font-bold">Diogo Laginha</h1>
            <p class="text-zinc-600">Full-stack turned frontend lead</p>
            <p class="text-sm text-zinc-500">15 years in software</p>
          </div>
        </header>

        <main>
          <div id="root"></div>
          <noscript>
            <p class="text-left text-zinc-600 px-4">
              This page is a sliding puzzle that needs JavaScript. The short
              version: I am a frontend lead working with Next.js, React and
              TypeScript, and my
              <a class="link" href="/cv.html">CV</a> has the rest.
            </p>
          </noscript>

          <blockquote class="italic my-8 text-zinc-500">
            Life is like a puzzle not pieced yet<br />
            Might take a village elder long to see that
          </blockquote>
        </main>
      </div>

      <footer class="text-zinc-500 text-right px-2">
        made with React and Tailwind
      </footer>
    </div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
